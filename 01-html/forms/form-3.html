<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
    </head>
    <body>
        <form>
            <h2>User Register</h2>
            <label for="username">Username</label>
            <input type="text" name="username" id="username" /><br /><br />

            <label for="password">Password</label>
            <input type="password" name="password" id="password" /><br /><br />

            <hr />

            <label for="email">Emailingiz</label>
            <input type="email" name="email" id="email" /><br /><br />

            <label for="sana">Tug'ilgan sana</label>
            <input type="date" name="date" id="sana" /><br /><br />

            <label for="student">Talaba</label>
            <input type="checkbox" name="student" id="student" /> <br /><br />

            <lable for="erkak">Erkak</lable>
            <input type="radio" name="gender" value="male" />

            <label for="ayol">Ayol</label>
            <input type="radio" name="gender" value="female" /> <br />
            <br />

            <label for="passport">Passport</label>
            <input type="file" name="passport" id="passport0" /> <br /><br />

            <hr />

            <label for="tajriba">Tajribangiz (yil)</label>
            <select name="experience" id="tajriba">
                <option value="0">Tajribam yo'q</option>
                <option value="1">1 yildan kam</option>
                <option value="2">1 yildan ko'proq</option>
            </select>

            <br /><br />

            <labal for="haqida">O'zingiz haqingizda</labal> <br />
            <textarea name="about" id="haqida" cols="30" rows="10"></textarea
            ><br /><br />
            <button type="submit">Register</button>
        </form>
    </body>
</html>
