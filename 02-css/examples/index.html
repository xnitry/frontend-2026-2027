<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            .parent {
                display: grid;
                grid-template-columns: repeat(5, 1fr);
                grid-template-rows: repeat(5, 1fr);
                gap: 8px;
            }

            .div5 {
                grid-column-start: 5;
                grid-row-start: 1;
            }

            .div6 {
                grid-column-start: 3;
                grid-row-start: 3;
            }

            .div7 {
                grid-column-start: 1;
                grid-row-start: 5;
            }

            .div8 {
                grid-column-start: 5;
                grid-row-start: 5;
            }

            .div9 {
                grid-column-start: 1;
                grid-row-start: 3;
            }

            .div10 {
                grid-column-start: 5;
                grid-row-start: 3;
            }

            .div11 {
                grid-column-start: 3;
                grid-row-start: 1;
            }

            .div12 {
                grid-column-start: 3;
                grid-row-start: 5;
            }
        </style>
    </head>
    <body>
        <div class="parent">
            <div class="div1">1</div>
            <div class="div5">5</div>
            <div class="div6">6</div>
            <div class="div7">7</div>
            <div class="div8">8</div>
            <div class="div9">9</div>
            <div class="div10">10</div>
            <div class="div11">11</div>
            <div class="div12">12</div>
        </div>
    </body>
</html>
